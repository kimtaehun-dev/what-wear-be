[project]
name = "what-to-wear-be"
version = "0.1.0"
description = "Personalized clothing recommendation API based on weather"
readme = "README.md"
authors = [
    { name = "TaeHunKim", email = "changetodev@gmail.com" }
]
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.128.8",
    "uvicorn[standard]>=0.39.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"